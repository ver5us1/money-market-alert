name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: money_market_alert_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d money_market_alert_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/money_market_alert_ci
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Check imports and Python syntax
        run: |
          python -c "import money_market_alert.bot.app, psycopg, requests, dotenv"
          python -m compileall -q src scripts examples tests
      - name: Initialize fresh test database
        run: python scripts/init_db.py
      - name: Verify repeat initialization
        run: python scripts/init_db.py
      - name: Run unit and PostgreSQL tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python examples/demo.py
